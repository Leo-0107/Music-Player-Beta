name: Temporary PCM native Node test
on:
  push:
    branches:
      - test/pcm-node-runner-20261114
permissions:
  contents: read
jobs:
  pcm-node-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run native Node.js test runner
        run: node --test tests/pcm-processing.test.js
