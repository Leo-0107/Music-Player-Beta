name: Temporary PCM audio integration test
on:
  push:
    branches:
      - test/pcm-audio-e2e-20261114
permissions:
  contents: read
jobs:
  pcm-audio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated PR source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Generate synthetic WAV
        run: |
          python3 - <<'PY'
          import math, struct, wave
          sample_rate = 48000
          seconds = 24
          with wave.open("pcm-e2e-test.wav", "wb") as output:
              output.setnchannels(2)
              output.setsampwidth(2)
              output.setframerate(sample_rate)
              frames = bytearray()
              for i in range(sample_rate * seconds):
                  t = i / sample_rate
                  envelope = min(1.0, t * 5, (seconds - t) * 5)
                  left = int(5000 * envelope * math.sin(2 * math.pi * 440 * t))
                  right = int(5000 * envelope * math.sin(2 * math.pi * 660 * t))
                  frames.extend(struct.pack("<hh", left, right))
              output.writeframes(frames)
          PY
      - name: Start local application server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/music-player-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/music-player-http.log
          exit 1
      - name: Exercise the real local-file PCM playback route
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ["--autoplay-policy=no-user-gesture-required"]
            });
            const page = await browser.newPage({
              viewport: { width: 1365, height: 900 },
              acceptDownloads: false
            });
            const pageErrors = [];
            const fallbackWarnings = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            page.on("console", message => {
              const text = message.text();
              if (/Music Player PCM playback fallback/i.test(text)) fallbackWarnings.push(text);
            });

            await page.addInitScript(() => {
              const audit = window.__pcmAudit = {
                workerUrls: [],
                workerRequests: [],
                workerResponses: [],
                workerErrors: [],
                sourceStarts: [],
                audioContexts: []
              };
              const NativeWorker = window.Worker;
              window.Worker = class AuditedWorker extends NativeWorker {
                constructor(url, options) {
                  super(url, options);
                  const resolvedUrl = String(url);
                  audit.workerUrls.push(resolvedUrl);
                  this.addEventListener("message", event => {
                    const data = event.data || {};
                    audit.workerResponses.push({
                      url: resolvedUrl,
                      type: data.type,
                      id: data.id,
                      sequence: data.sequence
                    });
                  });
                  this.addEventListener("error", event => {
                    audit.workerErrors.push(event.message || "Worker error");
                  });
                  this.addEventListener("messageerror", () => {
                    audit.workerErrors.push("Worker message deserialization error");
                  });
                }
                postMessage(message, transfer) {
                  audit.workerRequests.push({
                    url: String(this.__pcmAuditUrl || ""),
                    type: message?.type,
                    sequence: message?.sequence
                  });
                  return super.postMessage(message, transfer);
                }
              };

              if (window.AudioBufferSourceNode?.prototype?.start) {
                const nativeStart = AudioBufferSourceNode.prototype.start;
                AudioBufferSourceNode.prototype.start = function(...args) {
                  audit.sourceStarts.push({
                    when: Number(args[0]) || 0,
                    offset: Number(args[1]) || 0
                  });
                  return nativeStart.apply(this, args);
                };
              }

              if (window.AudioContext) {
                const NativeAudioContext = window.AudioContext;
                window.AudioContext = new Proxy(NativeAudioContext, {
                  construct(target, args, newTarget) {
                    const context = Reflect.construct(target, args, newTarget);
                    audit.audioContexts.push(context);
                    return context;
                  }
                });
              }
            });

            const response = await page.goto("http://127.0.0.1:4173/index.html", {
              waitUntil: "domcontentloaded",
              timeout: 60000
            });
            if (!response || response.status() !== 200) {
              throw new Error("Application index.html did not return HTTP 200");
            }
            await page.waitForFunction(() =>
              !!document.querySelector("#btnPlay") &&
              !document.body.classList.contains("app-loading"),
              null,
              { timeout: 45000 }
            );

            await page.locator("#folder").setInputFiles("pcm-e2e-test.wav");
            await page.locator(".song").first().waitFor({ state: "visible", timeout: 30000 });
            await page.locator(".song").first().click();

            await page.waitForFunction(() => {
              const audit = window.__pcmAudit;
              return audit &&
                audit.workerUrls.some(url => url.includes("11.%20pcm-processing-worker.js") ||
                  url.includes("11. pcm-processing-worker.js")) &&
                audit.workerResponses.some(message => message.type === "processed") &&
                audit.sourceStarts.length > 0;
            }, null, { timeout: 45000 });

            await page.waitForFunction(() =>
              document.querySelector("#btnPlay")?.textContent.includes("一時停止"),
              null,
              { timeout: 15000 }
            );

            const initial = await page.evaluate(() => ({
              progress: Number(document.querySelector("#progress")?.value || 0),
              audit: {
                workerUrls: window.__pcmAudit.workerUrls,
                workerRequests: window.__pcmAudit.workerRequests,
                workerResponses: window.__pcmAudit.workerResponses,
                sourceStarts: window.__pcmAudit.sourceStarts.length,
                audioContextStates: window.__pcmAudit.audioContexts.map(context => context.state)
              }
            }));
            if (!initial.audit.workerResponses.some(message => message.type === "processed")) {
              throw new Error("PCM Worker did not return a processed chunk: " + JSON.stringify(initial));
            }
            if (!initial.audit.sourceStarts) {
              throw new Error("PCM AudioBufferSourceNode was never scheduled: " + JSON.stringify(initial));
            }

            // Pause and resume through the application's actual playback control.
            await page.locator("#btnPlay").click();
            await page.waitForFunction(() =>
              document.querySelector("#btnPlay")?.textContent.includes("再生"),
              null,
              { timeout: 10000 }
            );
            await page.locator("#btnPlay").click();
            await page.waitForFunction(() =>
              document.querySelector("#btnPlay")?.textContent.includes("一時停止"),
              null,
              { timeout: 15000 }
            );

            // Seek through the actual progress control.
            await page.locator("#progress").evaluate(element => {
              element.value = "55";
              element.dispatchEvent(new Event("input", { bubbles: true }));
              element.dispatchEvent(new Event("change", { bubbles: true }));
            });
            await page.waitForTimeout(700);

            // Change playback rate and pitch through their real UI controls.
            await page.locator("#playbackRate").evaluate(element => {
              element.value = "1.25";
              element.dispatchEvent(new Event("input", { bubbles: true }));
            });
            await page.locator("#pitchShift").evaluate(element => {
              element.value = "2";
              element.dispatchEvent(new Event("input", { bubbles: true }));
            });
            const eqSliders = page.locator("#eqBands input[type=range]");
            if (await eqSliders.count()) {
              await eqSliders.first().evaluate(element => {
                element.value = String(Math.min(Number(element.max), Number(element.value) + 1));
                element.dispatchEvent(new Event("input", { bubbles: true }));
              });
            }
            await page.waitForTimeout(2500);

            const finalState = await page.evaluate(() => ({
              playButton: document.querySelector("#btnPlay")?.textContent || "",
              rateText: document.querySelector("#rateText")?.textContent || "",
              pitchText: document.querySelector("#pitchText")?.textContent || "",
              progress: Number(document.querySelector("#progress")?.value || 0),
              eqSliderCount: document.querySelectorAll("#eqBands input[type=range]").length,
              workerUrls: window.__pcmAudit.workerUrls,
              workerRequests: window.__pcmAudit.workerRequests,
              workerResponses: window.__pcmAudit.workerResponses,
              workerErrors: window.__pcmAudit.workerErrors,
              sourceStarts: window.__pcmAudit.sourceStarts.length,
              audioContextStates: window.__pcmAudit.audioContexts.map(context => context.state)
            }));

            const processedResponses = finalState.workerResponses.filter(message => message.type === "processed").length;
            if (processedResponses < 2) {
              throw new Error("PCM processing did not continue after playback operations: " + JSON.stringify(finalState));
            }
            if (finalState.workerErrors.length) {
              throw new Error("PCM Worker runtime errors: " + JSON.stringify(finalState.workerErrors));
            }
            if (pageErrors.length || fallbackWarnings.length) {
              throw new Error("Browser runtime/fallback issue: " + JSON.stringify({ pageErrors, fallbackWarnings, finalState }));
            }
            if (!finalState.rateText.includes("1.25") || !finalState.pitchText.includes("2")) {
              throw new Error("Playback rate or pitch UI did not retain requested values: " + JSON.stringify(finalState));
            }

            console.log("PCM audio integration PASS");
            console.log(JSON.stringify({
              initial,
              final: {
                playButton: finalState.playButton,
                rateText: finalState.rateText,
                pitchText: finalState.pitchText,
                progress: finalState.progress,
                eqSliderCount: finalState.eqSliderCount,
                workerCount: finalState.workerUrls.length,
                workerRequestCount: finalState.workerRequests.length,
                processedResponses,
                sourceStarts: finalState.sourceStarts,
                audioContextStates: finalState.audioContextStates
              },
              pageErrors,
              fallbackWarnings
            }, null, 2));

            await page.locator("#btnPlay").click().catch(() => {});
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
