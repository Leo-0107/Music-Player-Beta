name: PCM processing regression tests

on:
  push:
    branches:
      - main15/pcm-worker-protocol-hardening
  pull_request:
    branches:
      - main
    paths:
      - "js/1. ctrl.js"
      - "js/2. audio.js"
      - "js/3. audio-output.js"
      - "js/4. state.js"
      - "js/5. storage.js"
      - "js/6. library.js"
      - "js/7. ui.js"
      - "js/9. youtube.js"
      - "js/10. buffered-playback-engine.js"
      - "js/11. pcm-processing-worker.js"
      - "tests/pcm-processing.test.js"
      - ".github/workflows/pcm-processing-regression.yml"

permissions:
  contents: read

jobs:
  pcm-processing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check runtime JavaScript and the exact combined application bundle
        run: |
          node --check "js/1. ctrl.js"
          node --check "js/11. pcm-processing-worker.js"
          node --check tests/pcm-processing.test.js
          {
            printf '(() => {\n'
            cat "js/5. storage.js" "js/4. state.js" "js/2. audio.js" "js/3. audio-output.js" "js/10. buffered-playback-engine.js" "js/6. library.js" "js/7. ui.js" "js/9. youtube.js"
            printf '\n})();\n'
          } > "$RUNNER_TEMP/music-player-runtime.js"
          node --check "$RUNNER_TEMP/music-player-runtime.js"

      - name: Run PCM processing and fallback regression tests
        run: node --test tests/pcm-processing.test.js
