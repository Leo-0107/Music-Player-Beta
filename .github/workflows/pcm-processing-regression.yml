name: PCM processing regression tests

on:
  push:
    branches:
      - main15/pcm-worker-protocol-hardening
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "js/13. sw.js"
      - "js/8. pitch-worklet.js"
      - "js/12. speaker-delay-worklet.js"
      - "js/1. ctrl.js"
      - "js/7. audio.js"
      - "js/11. audio-output.js"
      - "js/2. state.js"
      - "js/3. storage.js"
      - "js/4. library.js"
      - "js/6. ui.js"
      - "js/5. youtube.js"
      - "js/9. buffered-playback-engine.js"
      - "js/10. pcm-processing-worker.js"
      - "tests/pcm-processing.test.js"
      - ".github/workflows/pcm-processing-regression.yml"

permissions:
  contents: read

jobs:
  pcm-processing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check runtime JavaScript and the exact combined application bundle
        run: |
          node --check "js/1. ctrl.js"
          node --check "js/2. state.js"
          node --check "js/3. storage.js"
          node --check "js/4. library.js"
          node --check "js/5. youtube.js"
          node --check "js/6. ui.js"
          node --check "js/7. audio.js"
          node --check "js/8. pitch-worklet.js"
          node --check "js/9. buffered-playback-engine.js"
          node --check "js/10. pcm-processing-worker.js"
          node --check "js/11. audio-output.js"
          node --check "js/12. speaker-delay-worklet.js"
          node --check sw.js
          node --check "js/13. sw.js"
          node --check "js/10. pcm-processing-worker.js"
          node --check "js/8. pitch-worklet.js"
          node --check "js/12. speaker-delay-worklet.js"
          node --check tests/pcm-processing.test.js
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
          {
            printf '(() => {\n'
            cat "js/3. storage.js" "js/2. state.js" "js/7. audio.js" "js/11. audio-output.js" "js/9. buffered-playback-engine.js" "js/4. library.js" "js/6. ui.js" "js/5. youtube.js"
            printf '\n})();\n'
          } > "$RUNNER_TEMP/music-player-runtime.js"
          node --check "$RUNNER_TEMP/music-player-runtime.js"

      - name: Run PCM processing and fallback regression tests
        run: node --test tests/pcm-processing.test.js
